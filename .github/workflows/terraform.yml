# Very beginning 

name: Terraform Infra (Plan + Manual Approval)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request: 

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Plan
        working-directory: infra
        run: |
          terraform plan \
            -out=tfplan \
            #-var "subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            #-var "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            #-var "client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" \
            #-var "tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var "acr_name=${{ secrets.ACR_NAME }}"

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 7

  apply:
    name: Terraform Apply (Manual Approval)
    needs: plan
    runs-on: ubuntu-latest

    environment:
      name: terraform-approval

    steps:
      - uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve tfplan

      - name: Get ACR credentials
        id: acr-creds
        working-directory: infra
        run: |
          ACR_USERNAME=$(terraform output -raw acr_admin_username | tr -d '\r\n')
          ACR_PASSWORD=$(terraform output -raw acr_admin_password | tr -d '\r\n')
          ACR_LOGIN_SERVER=$(terraform output -raw acr_login_server | tr -d '\r\n')

          # write to GitHub Actions environment file
          #echo "ACR_USERNAME=$ACR_USERNAME" >> $GITHUB_ENV
          #echo "ACR_PASSWORD=$ACR_PASSWORD" >> $GITHUB_ENV
          #echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> $GITHUB_ENV

