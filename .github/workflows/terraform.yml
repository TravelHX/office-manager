# Very beginning 

name: Terraform Infra (Plan + Manual Approval)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request: 

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Plan
        working-directory: infra
        run: |
          terraform plan \
            -out=tfplan \
            -var "acr_name=${{ secrets.ACR_NAME }}"

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 7

  apply:
    name: Terraform Apply (Manual Approval)
    needs: plan
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    environment:
      name: terraform-approval

    steps:
      - uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve tfplan

      - name: Get ACR credentials
        id: acr-creds
        working-directory: infra
        run: |
          ACR_USERNAME=$(terraform output -raw acr_admin_username | tr -d '\r\n')
          ACR_PASSWORD=$(terraform output -raw acr_admin_password | tr -d '\r\n')
          ACR_LOGIN_SERVER=$(terraform output -raw acr_login_server | tr -d '\r\n')

          # expose outputs to next jobs
          echo "acr_username=$ACR_USERNAME" >> $GITHUB_OUTPUT
          echo "acr_password=$ACR_PASSWORD" >> $GITHUB_OUTPUT
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> $GITHUB_OUTPUT


  build-and-push:
    name: Build & Push Docker Image
    needs: apply
    runs-on: ubuntu-latest
    #env:
      #ACR_USERNAME: ${{ needs.apply.outputs.ACR_USERNAME }}
      #ACR_PASSWORD: ${{ needs.apply.outputs.ACR_PASSWORD }}
      #ACR_LOGIN_SERVER: ${{ needs.apply.outputs.ACR_LOGIN_SERVER }}


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/office-manager:latest \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/office-manager:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/office-manager:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/office-manager:${{ github.sha }}        
