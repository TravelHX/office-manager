<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Release history - Office Manager</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .release-history-panel {
            max-width: 52rem;
            margin: 0 auto;
        }
        .release-history-panel pre {
            white-space: pre-wrap;
            word-break: break-word;
            font-family: ui-monospace, Consolas, monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            padding: 1rem 1.25rem;
            background: var(--surface-elevated, #f5f5f5);
            border-radius: 8px;
            border: 1px solid var(--border-subtle, #e0e0e0);
        }
    </style>
</head>
<body class="app-shell">
    <header class="app-topbar">
        <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation menu" aria-expanded="true" aria-controls="site-sidebar">&#9776;</button>
        <a href="/" class="app-brand">Office Manager</a>
        <div class="app-topbar-spacer"></div>
        <div id="account-menu-anchor" class="account-menu-anchor"></div>
    </header>
    <div class="app-body">
        <aside id="site-sidebar" class="site-sidebar" aria-label="Main navigation">
            <nav class="site-sidebar-inner">
                <ul class="sidebar-nav">
                    <li><a href="/">Home</a></li>
                    <li><a href="/pages/desk-booking.html">Desk Booking</a></li>
                    <li><a href="/pages/parking.html">Parking</a></li>
                    <li><a href="/pages/bookings.html">My Bookings</a></li>
                    <li><a href="/pages/matrix.html">Booking Matrix</a></li>
                    <li><a href="/pages/admin.html">Admin</a></li>
                </ul>
            </nav>
        </aside>
        <div class="app-content-wrap">
            <main class="app-main">
                <div class="container release-history-panel">
                    <h1>Release history</h1>
                    <p class="text-muted" style="margin-bottom: 1rem;">Deployed versions and changes are recorded in <code>data/release_history.txt</code>.</p>
                    <pre id="release-history-content" aria-live="polite">Loading...</pre>
                </div>
            </main>
        </div>
    </div>

    <footer class="app-footer">
        <p>&copy; 2025 Office Manager. All rights reserved.</p>
        <p id="app-version" style="font-size: 0.85rem; opacity: 0.85; margin-top: 0.5rem;">Version: <a id="version-link" href="/pages/release-history.html"><span id="version-number">-</span></a></p>
    </footer>

    <script src="/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const el = document.getElementById('release-history-content');
            try {
                const res = await fetch('/api/release-history');
                if (!res.ok) throw new Error('Failed to load release history');
                const data = await res.json();
                el.textContent = typeof data.content === 'string' ? data.content : '';
            } catch (e) {
                el.textContent = 'Could not load release history. Please try again later.';
            }
        });
    </script>
</body>
</html>
