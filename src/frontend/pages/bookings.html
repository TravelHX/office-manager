<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - Office Manager</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="app-shell">
    <header class="app-topbar">
        <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation menu" aria-expanded="true" aria-controls="site-sidebar">&#9776;</button>
        <a href="/" class="app-brand">Office Manager</a>
        <div class="app-topbar-spacer"></div>
        <div id="account-menu-anchor" class="account-menu-anchor"></div>
    </header>
    <div class="app-body">
        <aside id="site-sidebar" class="site-sidebar" aria-label="Main navigation">
            <nav class="site-sidebar-inner">
                <ul class="sidebar-nav">
                    <li><a href="/">Home</a></li>
                    <li><a href="/pages/desk-booking.html">Desk Booking</a></li>
                    <li><a href="/pages/parking.html">Parking</a></li>
                    <li><a href="/pages/bookings.html">My Bookings</a></li>
                    <li><a href="/pages/matrix.html">Booking Matrix</a></li>
                    <li><a href="/pages/admin.html">Admin</a></li>
                </ul>
            </nav>
        </aside>
        <div class="app-content-wrap">
            <main class="app-main">
                <div class="container">
            <h2>My Bookings</h2>
            <p>View and manage your desk bookings and parking reservations.</p>

            <div class="bookings-controls">
                <div class="search-filter-group">
                    <input type="text" id="search-input" placeholder="Search bookings or reservations..." class="search-input">
                    <select id="status-filter" class="filter-select">
                        <option value="">All Statuses</option>
                        <option value="active">Active</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                    <select id="type-filter" class="filter-select">
                        <option value="">All Types</option>
                        <option value="booking">Desk Bookings</option>
                        <option value="reservation">Parking Reservations</option>
                    </select>
                </div>
            </div>
            
            <div id="bookings-container">
                <p>Loading bookings...</p>
            </div>
                </div>
            </main>
        </div>
    </div>

    <footer class="app-footer">
        <p>&copy; 2025 Office Manager. All rights reserved.</p>
        <p id="app-version" style="font-size: 0.85rem; opacity: 0.85; margin-top: 0.5rem;">Version: <a id="version-link" href="/pages/release-history.html"><span id="version-number">-</span></a></p>
    </footer>

    <script src="/js/main.js"></script>
    <script src="/js/notifications.js"></script>
    <script src="/js/bookings.js"></script>
</body>
</html>
