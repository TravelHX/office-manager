<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - Office Manager</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="nav-container">
                <h1>Office Manager</h1>
                <ul class="nav-menu">
                    <li><a href="/">Home</a></li>
                    <li><a href="/pages/desk-booking.html">Desk Booking</a></li>
                    <li><a href="/pages/parking.html">Parking</a></li>
                    <li><a href="/pages/overtime.html">Overtime</a></li>
                    <li><a href="/pages/bookings.html">My Bookings</a></li>
                    <li><a href="/pages/admin.html">Admin</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">
            <h2>My Bookings</h2>
            <p>View and manage your desk bookings, parking reservations, and overtime records.</p>
            
            <div class="bookings-controls">
                <div class="search-filter-group">
                    <input type="text" id="search-input" placeholder="Search bookings, reservations, or overtime..." class="search-input">
                    <select id="status-filter" class="filter-select">
                        <option value="">All Statuses</option>
                        <option value="active">Active</option>
                        <option value="cancelled">Cancelled</option>
                        <option value="pending">Pending</option>
                        <option value="approved">Approved</option>
                    </select>
                    <select id="type-filter" class="filter-select">
                        <option value="">All Types</option>
                        <option value="booking">Desk Bookings</option>
                        <option value="reservation">Parking Reservations</option>
                        <option value="overtime">Overtime Records</option>
                    </select>
                </div>
            </div>
            
            <div id="bookings-container">
                <p>Loading bookings...</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Office Manager. All rights reserved.</p>
    </footer>

    <script src="/js/main.js"></script>
    <script src="/js/notifications.js"></script>
    <script src="/js/bookings.js"></script>
</body>
</html>
