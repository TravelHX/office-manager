<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desk Booking - Office Manager</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="nav-container">
                <h1>Office Manager</h1>
                <ul class="nav-menu">
                    <li><a href="/">Home</a></li>
                    <li><a href="/pages/desk-booking.html">Desk Booking</a></li>
                    <li><a href="/pages/parking.html">Parking</a></li>
                    <li><a href="/pages/overtime.html">Overtime</a></li>
                    <li><a href="/pages/bookings.html">My Bookings</a></li>
                    <li><a href="/pages/admin.html">Admin</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">
            <h2>Desk Booking</h2>
            <p>Select a date range and book an available desk.</p>
            
            <div class="booking-form">
                <div class="form-group">
                    <label for="startDate">Start Date:</label>
                    <input type="date" id="startDate" required>
                </div>
                
                <div class="form-group">
                    <label for="endDate">End Date:</label>
                    <input type="date" id="endDate" required>
                </div>
                
                <button id="checkAvailabilityBtn" class="btn-primary">Check Availability</button>
            </div>

            <div id="availability-message" class="mt-2"></div>
            
            <div id="desks-container" class="mt-2">
                <p>Select dates and click "Check Availability" to see available desks.</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Office Manager. All rights reserved.</p>
        <p id="app-version" style="font-size: 0.85rem; color: #999; margin-top: 0.5rem;">Version: <span id="version-number">-</span></p>
    </footer>

    <script src="/js/main.js"></script>
    <script src="/js/notifications.js"></script>
    <script src="/js/desk-booking.js"></script>
</body>
</html>
