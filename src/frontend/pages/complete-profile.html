<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete profile - Office Manager</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="app-shell">
    <header class="app-topbar">
        <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation menu" aria-expanded="true" aria-controls="site-sidebar">&#9776;</button>
        <a href="/" class="app-brand">Office Manager</a>
        <div class="app-topbar-spacer"></div>
        <div id="account-menu-anchor" class="account-menu-anchor"></div>
    </header>
    <div class="app-body">
        <aside id="site-sidebar" class="site-sidebar" aria-label="Main navigation">
            <nav class="site-sidebar-inner">
                <ul class="sidebar-nav">
                    <li><a href="/">Home</a></li>
                    <li><a href="/pages/login.html">Log in</a></li>
                </ul>
            </nav>
        </aside>
        <div class="app-content-wrap">
            <main class="app-main app-main--auth">
        <div class="container login-container" style="max-width: 420px; margin: 0 auto;">
            <h2>Complete your profile</h2>
            <p id="provision-intro">Set your password and office location to finish account setup.</p>
            <p id="provision-email" class="mt-2" style="color: #555;"></p>

            <div id="token-error" class="error" style="display: none;"></div>

            <form id="complete-profile-form" style="display: none;">
                <div class="form-group">
                    <label for="officeLocation">Office location:</label>
                    <select id="officeLocation" required>
                        <option value="">Select location...</option>
                        <option value="London">London</option>
                        <option value="Prague">Prague</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="newPassword">Password:</label>
                    <input type="password" id="newPassword" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm password:</label>
                    <input type="password" id="confirmPassword" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn-primary" id="submitBtn">Complete setup</button>
            </form>
            <div id="complete-message" class="mt-2"></div>
        </div>
            </main>
        </div>
    </div>

    <footer class="app-footer">
        <p>&copy; 2025 Office Manager. All rights reserved.</p>
        <p id="app-version" style="font-size: 0.85rem; opacity: 0.85; margin-top: 0.5rem;">Version: <span id="version-number">-</span></p>
    </footer>

    <script src="/js/main.js"></script>
    <script src="/js/complete-profile.js"></script>
</body>
</html>
